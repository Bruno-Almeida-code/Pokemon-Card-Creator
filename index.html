<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pokédex Poster + Pokémon Cards Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>

/* ╔══════════════════════════════════╗
   ║  1. CSS VARIABLES                ║
   ╚══════════════════════════════════╝ */
:root{
  /* UI chrome */
  --bg: #0c0f16;
  --panel: #14181f;
  --panel2: #10141b;
  --text: #e4eaf5;
  --muted: #8a96b4;
  --border: #222d42;
  --accent: #5b9cf5;
  --accent-bg: rgba(91,156,245,0.12);
  --accent-border: rgba(91,156,245,0.35);
  --shadow: 0 8px 24px rgba(0,0,0,.3);
  --radius: 10px;
  --zoom: .55;

  /* A4 page at 300 dpi */
  --page-w: 2480px;
  --page-h: 3508px;

  /* Poster */
  --pad-poster: 10px;
  --poster-cols: 9;
  --poster-rows: 13;
  --poster-row-gap: 0px;
  --poster-neg-row: 20px;
  --poster-col-gap: 0px;
  --poster-neg-col: 20px;
  --poster-name-fz: 18px;
  --poster-name-color: #111;

  /* Cards */
  --pad-cards: 0px;
  --card-cols: 3;
  --card-rows: 3;
  --card-gap: 12px;
  --card-gap-abs: 0px;
  --card-w: 760px;
  --card-h: 980px;
  --card-pad: 40px;
  --img: 480px;
  --sprite-shift-y: 0px;

  /* Card: evolution strip */
  --mini: 56px;
  --evo-fill: #eceff3;
  --evo-stroke: #fb923c;
  --evo-box-on: 0;
  --evo-box-scale: 0.6;
  --evo-box-bg: rgba(0,0,0,0.02);
  --evo-box-border: rgba(0,0,0,0.12);

  /* Card: typography */
  --head-fz: 26px;
  --meta-fz: 16px;
  --meta-label-fz: 36px;
  --meta-value-fz: 22px;
  --desc-fz: 36px;
  --meta-gap: 12px;

  /* Card: colors */
  --card-box-bg: #fff;
  --card-box-ink: #000;

  font-synthesis: none;
  text-rendering: geometricPrecision;
}


/* ╔══════════════════════════════════╗
   ║  2. RESET & BASE                 ║
   ╚══════════════════════════════════╝ */
*{ box-sizing: border-box; margin: 0; }
body{
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}


/* ╔══════════════════════════════════╗
   ║  3. APP LAYOUT                   ║
   ╚══════════════════════════════════╝ */
.app{ display: flex; min-height: 100vh; }

.sidebar{
  width: 400px;
  min-width: 400px;
  padding: 20px 16px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar-header{
  padding: 4px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}
.sidebar-header h1{
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.2px;
}

.stage-wrap{ flex: 1; overflow: auto; padding: 20px; }
.stage{ transform: scale(var(--zoom)); transform-origin: top left; }
#root{ display: flex; flex-direction: column; gap: 22px; }


/* ╔══════════════════════════════════╗
   ║  4. TABS                         ║
   ╚══════════════════════════════════╝ */
.tabs{
  display: flex;
  gap: 4px;
  padding: 3px;
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.tab{
  flex: 1;
  height: 32px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font: 600 13px/1 'Inter', sans-serif;
  transition: all .15s;
}
.tab:hover{ color: var(--text); background: rgba(255,255,255,0.04); }
.tab.active{
  background: var(--accent-bg);
  color: var(--accent);
}


/* ╔══════════════════════════════════╗
   ║  5. COLLAPSIBLE SECTIONS         ║
   ╚══════════════════════════════════╝ */
details.section{
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.02);
  overflow: hidden;
  transition: background .15s;
}
details.section[open]{ background: rgba(255,255,255,0.03); }
details.section + details.section{ margin-top: 2px; }

summary{
  padding: 10px 12px;
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
summary::-webkit-details-marker{ display: none; }
summary::before{
  content: '';
  width: 5px; height: 5px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(-45deg);
  transition: transform .15s;
  flex-shrink: 0;
}
details[open] > summary::before{ transform: rotate(45deg); }
summary:hover{ color: var(--text); }

.section-body{ padding: 4px 12px 12px; }


/* ╔══════════════════════════════════╗
   ║  6. FORM CONTROLS                ║
   ╚══════════════════════════════════╝ */
.row{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin: 6px 0;
}
label{
  display: flex;
  flex-direction: column;
  gap: 4px;
  font: 500 11px/1.3 'Inter', sans-serif;
  color: var(--muted);
}
input[type="number"], input[type="text"], select, textarea{
  font: 400 13px/1.3 'Inter', sans-serif;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
input[type="number"]:focus, input[type="text"]:focus, select:focus, textarea:focus{
  border-color: var(--accent);
}
input[type="number"], input[type="text"], select{
  height: 32px;
  min-width: 100px;
  padding: 4px 8px;
}
textarea{
  width: 100%;
  min-height: 56px;
  padding: 8px;
  resize: vertical;
}
.type-pill{
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 12px; border: 2px solid transparent;
  transition: opacity .1s, transform .1s;
  font-size: 11px; font-weight: 600; cursor: pointer;
  color: #fff; opacity: 0.4; transition: opacity .15s, border-color .15s;
  user-select: none; text-transform: capitalize;
}
.type-pill.active{ opacity: 1; border-color: rgba(255,255,255,0.5); }
.type-pill.drag-over{ transform: scale(1.12); border-color: #fff; }
#typeOrderList .type-pill{ cursor: grab; opacity: 1; }
#typeOrderList .type-pill:active{ cursor: grabbing; }
input[type="color"]{
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
  padding: 2px;
}
input[type="range"]{
  width: 100%;
  accent-color: var(--accent);
}


/* ╔══════════════════════════════════╗
   ║  7. TOGGLE SWITCH                ║
   ╚══════════════════════════════════╝ */
.toggle{
  position: relative;
  width: 36px; height: 20px;
  flex-shrink: 0;
}
.toggle input{ opacity: 0; width: 0; height: 0; }
.toggle-track{
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s;
}
.toggle-track::after{
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--muted);
  transition: all .15s;
}
.toggle input:checked + .toggle-track{
  background: var(--accent-bg);
}
.toggle input:checked + .toggle-track::after{
  left: 18px;
  background: var(--accent);
}


/* ╔══════════════════════════════════╗
   ║  8. BUTTONS & ACTIONS            ║
   ╚══════════════════════════════════╝ */
.actions{ display: flex; gap: 6px; padding: 8px 0; }

.btn{
  height: 34px;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  cursor: pointer;
  font: 600 13px/1 'Inter', sans-serif;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn:hover{ background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
.btn:active{ transform: scale(0.97); }

.btn.primary{
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.primary:hover{ background: #4a8de8; }

small{ color: var(--muted); font-size: 11px; line-height: 1.4; display: block; margin: 4px 0; }


/* ╔══════════════════════════════════╗
   ║  9. LOADING OVERLAY              ║
   ╚══════════════════════════════════╝ */
.loading{
  position: fixed;
  top: 12px; right: 12px;
  padding: 8px 14px;
  background: var(--panel);
  border: 1px solid var(--accent-border);
  border-radius: 8px;
  font: 500 12px/1 'Inter', sans-serif;
  color: var(--accent);
  z-index: 999;
  display: none;
  align-items: center;
  gap: 8px;
}
.loading.show{ display: flex; }
.spinner{
  width: 14px; height: 14px;
  border: 2px solid var(--accent-bg);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }


/* ╔══════════════════════════════════╗
   ║  10. A4 PAGE                     ║
   ╚══════════════════════════════════╝ */
.page{
  width: var(--page-w);
  height: var(--page-h);
  background: #fff;
  color: #0a0a0a;
  border-radius: 16px;
  box-shadow: 0 14px 50px rgba(0,0,0,.45);
  overflow: hidden;
  position: relative;
}
.page.poster{ overflow: visible; }
.inner{ width: 100%; height: 100%; }


/* ╔══════════════════════════════════╗
   ║  11. POSTER                      ║
   ╚══════════════════════════════════╝ */
.poster .inner{
  padding: var(--pad-poster);
  display: flex;
  flex-direction: column;
}
.poster-title{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  font-family: var(--poster-title-font, "VT323"), ui-monospace, monospace;
  padding: 16px 20px;
  line-height: 1;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
}
.poster-title .title-main{
  display: flex;
  align-items: center;
  gap: 0;
  font-size: 72px;
  letter-spacing: 2px;
}
.poster-title .gen-label{ color: #888; }
.poster-title .title-sep{ color: #888; padding: 0 6px; }
.poster-title .reg-label{ color: #111; font-weight: 800; }
.poster-title .title-desc-wrap{
  font-family: var(--poster-title-font, "VT323"), ui-monospace, monospace;
  font-size: 72px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.poster-grid{
  flex: 1;
  display: grid;
  grid-template-columns: repeat(var(--poster-cols), 1fr);
  grid-template-rows: repeat(var(--poster-rows), 1fr);
  row-gap: var(--poster-row-gap, 0px);
  column-gap: var(--poster-col-gap, 0px);
}
.poster .cell{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: visible;
  margin-top:    calc(var(--poster-neg-row, 0px) * -0.5);
  margin-bottom: calc(var(--poster-neg-row, 0px) * -0.5);
  margin-left:   calc(var(--poster-neg-col, 0px) * -0.5);
  margin-right:  calc(var(--poster-neg-col, 0px) * -0.5);
}
.caption{
  font-family: var(--poster-title-font, "VT323"), ui-monospace, monospace;
  font-size: var(--poster-name-fz);
  color: var(--poster-name-color);
  line-height: 1;
}
.poster .caption{
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 2;
}
.poster.mode-image .caption{
  position: absolute;
  top: calc(50% - var(--cap-offset-y, 100px));
  left: calc(50% - var(--cap-offset-x, 100px));
  text-align: left;
}
.poster.mode-grid .caption{
  position: static;
  align-self: center;
  text-align: center;
  margin-top: 4px;
}
.poster.mode-scatter .caption{
  position: absolute;
  top: calc(50% - var(--cap-offset-y, 100px));
  left: calc(50% - var(--cap-offset-x, 100px));
  text-align: left;
}
.poster.mode-scatter .inner{ position: relative; }
.poster .caption .cap-nm{ display: block; }
.poster .caption .cap-dex{ display: block; opacity: .6; }


/* ╔══════════════════════════════════╗
   ║  12. CARDS GRID                  ║
   ╚══════════════════════════════════╝ */
.cards .inner{
  padding: var(--pad-cards);
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.grid{
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: repeat(var(--card-cols), var(--card-w));
  grid-template-rows: repeat(var(--card-rows), var(--card-h));
  gap: var(--card-gap);
  justify-content: center;
  align-content: center;
}
.grid.neg-gap{
  gap: 0;
  column-gap: calc(var(--card-gap-abs) * -1);
  row-gap: calc(var(--card-gap-abs) * -1);
}


/* ╔══════════════════════════════════╗
   ║  13. CARD COMPONENT              ║
   ╚══════════════════════════════════╝ */

/* --- Card shell --- */
.card{
  width: var(--card-w);
  height: var(--card-h);
  background: var(--card-box-bg);
  color: var(--card-box-ink);
  border-radius: 24px;
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 10px 30px rgba(0,0,0,0.10);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.placeholder{ visibility: hidden; }

/* --- Head (name + number + type icon) --- */
.head{
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 2;
  padding: calc(var(--card-pad) * 1.5) calc(var(--card-pad) * 2.2) calc(var(--card-pad) * 0.3);
  border: none;
  font-family: "VT323", ui-monospace, monospace;
  line-height: 1;
}
.head .line{
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.head .bold{
  font-weight: 900;
  font-size: 34px;
  letter-spacing: .8px;
  line-height: 1.05;
}
.head .num{
  display: block;
  margin-top: 8px;
  font-size: 28px;
  opacity: .7;
}
.head .right{
  margin-left: auto;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  min-width: 56px;
}

/* --- Core (main sprite) --- */
.core{
  padding: 0;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sprite-wrap{
  position: relative;
  width: var(--img);
  height: var(--img);
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateY(var(--sprite-shift-y));
}
img.poke{
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}
img.poke.pixel{
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* --- Evolution strip --- */
.evo-strip{
  margin-top: calc(var(--card-pad) * -1.2);
  padding: 0 calc(var(--card-pad) * 2.2) calc(var(--card-pad) * 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  border: none;
  flex: 0 0 auto;
}
.mini-wrap{
  width: calc(var(--mini) * var(--evo-box-scale));
  height: calc(var(--mini) * var(--evo-box-scale));
  border-radius: 14px;
  background: color-mix(in srgb, var(--evo-box-bg) calc(var(--evo-box-on) * 100%), transparent);
  border: 1px solid color-mix(in srgb, var(--evo-box-border) calc(var(--evo-box-on) * 100%), transparent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-wrap.current{
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.10);
}
img.mini{
  width: calc(var(--mini) * 0.82);
  height: calc(var(--mini) * 0.82);
  object-fit: contain;
  display: block;
}
.arrow{
  width: 30px; height: 2px;
  background: rgba(0,0,0,0.35);
  border-radius: 99px;
  position: relative;
  opacity: .35;
}
.arrow::after{
  content: "";
  position: absolute;
  right: -2px; top: 50%;
  width: 6px; height: 6px;
  transform: translateY(-50%) rotate(45deg);
  border-right: 2px solid rgba(0,0,0,0.35);
  border-top: 2px solid rgba(0,0,0,0.35);
}

/* --- Info (ability, region, description) --- */
.info{
  padding: calc(var(--card-pad) * 0.4) calc(var(--card-pad) * 2.2) calc(var(--card-pad) * 0.8);
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1 0 auto;
  overflow: hidden;
}
.meta{
  color: rgba(0,0,0,0.72);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.meta b{
  color: rgba(0,0,0,0.88);
  font-size: var(--meta-label-fz);
  font-family: "VT323", ui-monospace, monospace;
}
.meta .meta-val{ font-size: var(--meta-label-fz); font-family: "VT323", ui-monospace, monospace; }
.desc{
  display: block;
  line-height: 1.3;
  color: rgba(0,0,0,0.72);
  overflow: hidden;
  font-family: "VT323", ui-monospace, monospace;
  font-size: var(--desc-fz);
  flex: 1 1 auto;
}

/* --- Type icon badge --- */
.type-badge{ display: flex; align-items: flex-start; justify-content: flex-end; }
.type-icon-wrap{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.type-icon-wrap svg{
  width: 76px; height: 76px;
  display: block;
}
.type-icon-fallback{
  width: 76px; height: 76px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-family: "VT323", ui-monospace, monospace;
  font-size: 38px;
}
.type-name-tag{
  font-family: "VT323", ui-monospace, monospace;
  font-size: 22px;
  letter-spacing: 1px;
  line-height: 1;
}

/* --- Ability pills --- */
.ab-list{
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.ab-tag{
  background: rgba(0,0,0,0.07);
  border-radius: 5px;
  padding: 3px 9px;
  font-size: var(--meta-value-fz);
  font-family: "VT323", ui-monospace, monospace;
  line-height: 1.4;
}
.ab-tag.ab-hidden{
  opacity: 0.5;
  font-style: italic;
}


/* ╔══════════════════════════════════╗
   ║  13b. PREMIUM CARD DESIGN        ║
   ╚══════════════════════════════════╝ */
/* Sizes are expressed in --u (1% of card height) so the design scales with the grid.
   Type colors (--t1, --t2 and their tints) are set inline per card by renderPremiumCard. */
.card.premium{
  --u: calc(var(--card-h) / 100);
  padding: calc(var(--u) * 1.3);
  border: none;
  border-radius: calc(var(--u) * 3);
  background: linear-gradient(145deg, var(--t1-light) 0%, var(--t1) 34%, var(--t2) 72%, var(--t1-deep) 100%);
  box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,0.18);
  font-family: 'Poppins', 'Inter', system-ui, sans-serif;
}
.card.premium.rare{
  background: linear-gradient(145deg, #fff6d5 0%, #e8c25a 28%, #fff0b3 52%, #c9952f 78%, #fbe7a1 100%);
}
.pc-body{
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.1);
  padding: calc(var(--u) * 1.8) calc(var(--u) * 1.8) calc(var(--u) * 1.3);
  border-radius: calc(var(--u) * 2);
  background: linear-gradient(180deg, var(--card-box-bg) 0%, var(--card-box-bg) 55%, var(--t1-wash) 100%);
  color: var(--card-box-ink);
}

/* --- Head --- */
.pc-head{
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 1.2);
  flex: 0 0 auto;
}
.pc-titles{ flex: 1 1 auto; min-width: 0; }
.pc-name{
  font-weight: 700;
  font-size: calc(var(--u) * 4.4);
  line-height: 1.05;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-genus{
  margin-top: calc(var(--u) * 0.4);
  font-size: calc(var(--u) * 1.9);
  font-weight: 500;
  opacity: .55;
  white-space: nowrap;
}
.pc-num{
  flex: 0 0 auto;
  font-family: 'Bebas Neue', sans-serif;
  font-size: calc(var(--u) * 3);
  line-height: 1;
  letter-spacing: .04em;
  padding: calc(var(--u) * 0.7) calc(var(--u) * 1.3) calc(var(--u) * 0.45);
  border-radius: 999px;
  background: var(--t1-wash);
  color: var(--t1-deep);
}
.pc-icon{
  flex: 0 0 auto;
  width: calc(var(--u) * 5.6);
  height: calc(var(--u) * 5.6);
  border-radius: 50%;
  background: linear-gradient(145deg, var(--t1-light), var(--t1) 55%, var(--t1-deep));
  box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 0.9) rgba(0,0,0,0.22);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pc-icon svg, .pc-icon .type-icon-fallback{
  width: 62%;
  height: 62%;
  background: none !important;
  font-size: calc(var(--u) * 2.6);
}

/* --- Art window --- */
.pc-art{
  position: relative;
  flex: 0 0 calc(var(--u) * 40);
  border-radius: calc(var(--u) * 1.8);
  overflow: hidden;
  border: calc(var(--u) * 0.35) solid rgba(255,255,255,0.95);
  background: radial-gradient(circle at 50% 42%, var(--t1-glow) 0%, var(--t1-soft) 48%, var(--t2-soft) 100%);
  background-clip: padding-box;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 calc(var(--u) * 0.5) calc(var(--u) * 1.4) rgba(0,0,0,0.14);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pc-sheen{
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  background: linear-gradient(115deg, rgba(255,255,255,0) 28%, rgba(255,255,255,0.38) 44%, rgba(255,255,255,0) 58%);
  pointer-events: none;
}
.pc-watermark{
  position: absolute;
  right: calc(var(--u) * -4);
  bottom: calc(var(--u) * -4);
  width: calc(var(--u) * 30);
  height: calc(var(--u) * 30);
  opacity: .16;
}
.pc-watermark svg, .pc-watermark .type-icon-fallback{
  width: 100%; height: 100%;
  background: none !important;
  font-size: calc(var(--u) * 20);
}
.pc-floor{
  position: absolute;
  left: 22%; right: 22%;
  bottom: calc(var(--u) * 3.2);
  height: calc(var(--u) * 2.6);
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0) 70%);
}
.card.premium .sprite-wrap{
  z-index: 1;
  width: var(--pc-img);
  height: var(--pc-img);
}
.pc-types{
  position: absolute;
  z-index: 2;
  left: calc(var(--u) * 1.2);
  top: calc(var(--u) * 1.2);
  display: flex;
  gap: calc(var(--u) * 0.6);
}
.pc-type{
  font-size: calc(var(--u) * 1.6);
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  line-height: 1;
  padding: calc(var(--u) * 0.55) calc(var(--u) * 1.2);
  border-radius: 999px;
  box-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.6) rgba(0,0,0,0.18);
}

/* --- Evolution chips --- */
.pc-evo{
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * 1);
}
.pc-evo-chip{
  width: calc(var(--u) * 6.6);
  height: calc(var(--u) * 6.6);
  border-radius: 50%;
  background: var(--t1-wash);
  border: calc(var(--u) * 0.3) solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: .7;
}
.pc-evo-chip.current{
  opacity: 1;
  background: var(--card-box-bg);
  border-color: var(--t1);
  box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 0.9) rgba(0,0,0,0.16);
}
.pc-evo img.mini{ width: 88%; height: 88%; }
.pc-evo img.mini.pixel{ image-rendering: pixelated; image-rendering: crisp-edges; }
.pc-evo-arrow{
  width: calc(var(--u) * 0.9);
  height: calc(var(--u) * 0.9);
  border-right: calc(var(--u) * 0.25) solid var(--t1);
  border-top: calc(var(--u) * 0.25) solid var(--t1);
  transform: rotate(45deg);
  opacity: .5;
}

/* --- Facts / abilities / stats --- */
.pc-label{
  font-size: calc(var(--u) * 1.35);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .5;
}
.pc-facts{
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: calc(var(--u) * 0.8);
}
.pc-fact{
  background: var(--t1-wash);
  border-radius: calc(var(--u) * 1.2);
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1);
  text-align: center;
}
.pc-fact .pc-val{
  margin-top: calc(var(--u) * 0.25);
  font-size: calc(var(--u) * 2.4);
  font-weight: 700;
  line-height: 1.1;
}
.pc-abil{
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: calc(var(--u) * 0.6);
}
.pc-abil .pc-label{ margin-right: calc(var(--u) * 0.4); }
.pc-pill{
  font-size: calc(var(--u) * 1.8);
  font-weight: 600;
  line-height: 1;
  padding: calc(var(--u) * 0.55) calc(var(--u) * 1.1);
  border-radius: 999px;
  border: 1px solid var(--t1-line);
  background: var(--card-box-bg);
}
.pc-pill.hidden{ border-style: dashed; opacity: .6; font-style: italic; }
.pc-stats{
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(3, auto);
  grid-auto-flow: column;
  column-gap: calc(var(--u) * 2);
  row-gap: calc(var(--u) * 0.7);
}
.pc-stat{
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 0.8);
  font-size: calc(var(--u) * 1.65);
}
.pc-stat .k{ width: calc(var(--u) * 4.2); font-weight: 600; letter-spacing: .08em; opacity: .55; }
.pc-stat .n{ width: calc(var(--u) * 3.4); text-align: right; font-weight: 700; }
.pc-bar{
  flex: 1 1 auto;
  height: calc(var(--u) * 1);
  border-radius: 999px;
  background: var(--t1-wash);
  overflow: hidden;
}
.pc-bar i{
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--t1), var(--t2));
}

/* --- Flavor text + footer --- */
.pc-desc{
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  font-size: calc(var(--u) * 2.15);
  line-height: 1.45;
  font-style: italic;
  opacity: .78;
  padding-left: calc(var(--u) * 1.2);
  border-left: calc(var(--u) * 0.35) solid var(--t1);
}
.pc-foot{
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: calc(var(--u) * 1.35);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .45;
}
.pc-foot .pc-rare{ color: #a87414; opacity: 1; }

/* html2canvas draws blurred shadows as hard dark bands — drop them in PNG export */
body[data-exporting="1"] .card.premium,
body[data-exporting="1"] .pc-art,
body[data-exporting="1"] .pc-icon,
body[data-exporting="1"] .pc-type,
body[data-exporting="1"] .pc-evo-chip{ box-shadow: none !important; }

/* Manual text mode overrides */
.card.premium[data-text="manual"] .pc-name{ font-size: var(--head-fz); }
.card.premium[data-text="manual"] .pc-desc{ font-size: var(--desc-fz); }
.card.premium[data-text="manual"] .pc-pill{ font-size: var(--meta-value-fz); }


/* ╔══════════════════════════════════╗
   ║  14. CARD TYPOGRAPHY             ║
   ╚══════════════════════════════════╝ */

/* Auto mode: scales with card height */
.card[data-text="auto"]{
  --auto-name: clamp(26px, calc(var(--card-h) * 0.050), 72px);
  --auto-num:  clamp(20px, calc(var(--card-h) * 0.038), 52px);
  --auto-meta: clamp(14px, calc(var(--card-h) * 0.024), 34px);
  --auto-desc: clamp(12px, calc(var(--card-h) * 0.020), 28px);
}
.card[data-text="auto"] .head{ font-size: var(--auto-name); }
.card[data-text="auto"] .head .bold{ font-size: var(--auto-name); }
.card[data-text="auto"] .head .num{ font-size: var(--auto-num); }
.card[data-text="auto"] .meta{ font-size: var(--auto-meta); }
.card[data-text="auto"] .desc{ font-size: var(--auto-desc); }

/* Manual mode: user-controlled px values */
.card[data-text="manual"] .head{ font-size: var(--head-fz); }
.card[data-text="manual"] .head .bold{ font-size: var(--head-fz); }
.card[data-text="manual"] .head .num{ font-size: calc(var(--head-fz) * 0.58); }
.card[data-text="manual"] .meta{ font-size: var(--meta-fz); }
.card[data-text="manual"] .desc{ font-size: var(--desc-fz); }


/* ╔══════════════════════════════════╗
   ║  15. PRINT & EXPORT              ║
   ╚══════════════════════════════════╝ */
body[data-exporting="1"] .stage{ transform: none !important; }

@media print{
  @page{ size: A4; margin: 5mm; }
  html, body{ margin: 0; padding: 0; background: #fff; }
  .sidebar, .loading{ display: none !important; }
  .stage-wrap{ padding: 0 !important; }
  .stage{ transform: none !important; }
  #root{ gap: 0 !important; }
  .page{
    border-radius: 0 !important;
    box-shadow: none !important;
    width: var(--page-w) !important;
    height: var(--page-h) !important;
    zoom: 0.30;
    margin: 0 !important;
    page-break-after: always;
    break-after: page;
    break-inside: avoid;
  }
  *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

</style>
</head>

<body data-mode="cards">

<!-- ══════ LOADING INDICATOR ══════ -->
<div id="loadingIndicator" class="loading">

</div>

<div class="app">
  <aside class="sidebar">

    <div class="sidebar-header">
      <h1>Pokédex Builder</h1>
    </div>

    <div class="tabs">
      <button class="tab active" data-mode="poster">Poster</button>
      <button class="tab" data-mode="cards">Cards</button>
    </div>

    <!-- ══════ DATASET & LOOK ══════ -->
    <details class="section" open>
      <summary>Dataset & Look</summary>
      <div class="section-body">

          <label>Generation

              <option value="5">Gen 5 — Unova</option>
              <option value="6">Gen 6 — Kalos</option>
              <option value="7">Gen 7 — Alola</option>

        </div>
        <div class="row">

        </div>

          <button id="cleanBtn" title="Reset to default" style="align-self:flex-end;margin-bottom:2px">✕ Clean</button>

        </div>
      </div>
    </details>

    <!-- ══════ POSTER SETTINGS ══════ -->
    <details class="section" id="posterPanel">

              <option value="image" selected>Image</option>
              <option value="grid">Grid</option>
              <option value="scatter">Scatter</option>
            </select>
          </label>

              <option value="Bebas Neue">Bebas Neue</option>

          <label>Padding <input id="posterPad" type="number" value="10" min="0" max="500"></label>

          <label id="capOffsetYRow">Offset Y <input id="capOffsetY" type="number" value="100" min="-400" max="400" step="1"></label>

            Show names

          <label style="flex-direction:row;gap:8px;align-items:center">

            Blue noise

        <div class="row" style="align-items:center;gap:12px">

            <div class="toggle">
              <input id="posterImagePreset" type="checkbox">
              <div class="toggle-track"></div>
            </div>
            Image preset
          </label>
        </div>
      </div>
    </details>

    <!-- ══════ CARDS: GRID ══════ -->
    <details class="section" id="cardsPanel" open>
      <summary>Cards Grid (3×3)</summary>

        <input id="cardCols" type="hidden" value="3">
        <input id="cardRows" type="hidden" value="3">
        <div class="row">
          <label>Gap <input id="cardGap" type="number" value="12" min="-60" max="120"></label>
          <label>Padding <input id="cardsPad" type="number" value="0" min="0" max="200"></label>

              <option value="premium" selected>Premium</option>
              <option value="classic">Classic</option>

          </label>
          <label id="pcStatsRow" style="flex-direction:row;gap:8px;align-items:center">

              <input id="pcStats" type="checkbox" checked>
              <div class="toggle-track"></div>
            </div>
            Base stats

        </div>
      </div>

            </select>
          </label>

    <!-- ══════ CARDS: LAYOUT ══════ -->

  <!-- ══════ STAGE (preview area) ══════ -->

}

  let dragSrc = null;

  container.addEventListener('dragstart', e => {
    dragSrc = e.target.closest('.type-pill');
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => dragSrc && dragSrc.classList.add('active'), 0);
  });

  container.addEventListener('dragover', e => {
    e.preventDefault();
    const target = e.target.closest('.type-pill');
    if(!target || target === dragSrc) return;
    // Remove drag-over from all
    container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    target.classList.add('drag-over');
    // Live reorder: insert before or after based on cursor position
    const rect = target.getBoundingClientRect();
    const after = e.clientX > rect.left + rect.width / 2;
    container.insertBefore(dragSrc, after ? target.nextSibling : target);
  });

  container.addEventListener('dragend', () => {
    if(dragSrc) dragSrc.classList.remove('active');
    container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    dragSrc = null;
    debouncedBuild();
  });

async function speciesById(id){

    id: +id,
    name: titleName(j.name),
    chain: j.evolution_chain?.url,
    generation: j.generation?.name,

async function pokemonData(id){
  const j = await cachedFetch(`https://pokeapi.co/api/v2/pokemon/${id}/`);
  return {
    types: j.types.map(t => t.type.name),
    abilities: j.abilities.sort((a,b) => a.slot - b.slot)
      .map(a => ({ name: titleName(a.ability.name), hidden: a.is_hidden })),
    stats: (j.stats || []).map(s => ({ name: s.stat.name, base: s.base_stat })),
    height: j.height,
    weight: j.weight
  };
}
function flavorFromRaw(raw, lang){
  const pref = (lang==='pt') ? ['pt-BR','pt','en'] : ['en'];
  const entries = [...(raw.flavor_text_entries||[])].reverse(); // newest game versions first
  for(const L of pref){
    const hit = entries.find(ft => ft.language?.name === L);
    if(hit) return hit.flavor_text.replace(/\f|\n/g,' ').replace(/\s+/g,' ').trim();
  }
  return '';
}
function localName(raw, lang){
  const pref = (lang==='pt') ? ['pt-BR','pt','en'] : ['en'];
  for(const L of pref){
    const hit = (raw.names||[]).find(n => n.language?.name === L);
    if(hit) return titleName(hit.name);
  }
  return titleName(raw.name);
}
async function evoLine(url){
  if(!url) return [];
  const j = await cachedFetch(url).catch(() => null);
  if(!j) return [];
  const out = [];
  (function walk(n){
    out.push(+n.species.url.split('/').slice(-2,-1)[0]);
    (n.evolves_to||[]).forEach(walk);
  })(j.chain);
  return [...new Set(out)];
}

function cardDims(cols, rows, pad, gap){
  const W = 2480-2*pad, H = 3508-2*pad, g = Math.max(gap, 0);
  const w = (W - g*(cols-1)) / cols;
  const h = (H - g*(rows-1)) / rows;
  return { w: Math.floor(w), h: Math.floor(h) };
}
function spriteSize(w, h, style){
  if(style !== 'pixel') return Math.floor(Math.min(w * 0.95, h * 0.75));
  const base = 96;
  let k;
  if(v('pxScale') === 'auto'){
    k = Math.min(w,h) / base;
    k = el('snapInt').checked ? Math.floor(k) : Math.round(k);
  } else {
    k = parseInt(v('pxScale'), 10);
  }
  return base * Math.max(1, k);
}

// Poster-specific sprite size: fills cell minus caption height, respects pxScale for pixel art
function posterImgSize(cellW, cellH, style){
  const showCap = el('posterShowCaption').checked;
  const isGrid  = (v('posterMode') || 'image') === 'grid';
  const captionH = (showCap && isGrid) ? parseInt(v('capPx')) + 4 : 0;
  const avail = Math.min(cellW, cellH - captionH);
  if(style !== 'pixel') return Math.floor(avail);
  const base = 96;
  if(v('pxScale') === 'auto'){
    const k = el('snapInt').checked ? Math.floor(avail/base) : Math.round(avail/base);
    return base * Math.max(1, k);
  }
  const desired = base * Math.max(1, parseInt(v('pxScale'), 10));
  return desired <= avail ? desired : base * Math.max(1, Math.floor(avail/base));
}
function bestFitLayout(n, pad, titleH, capPx, style, showCaption=true, overlapX=0, overlapY=0){
  const W = 2480 - 2*pad;
  const H = 3508 - 2*pad - titleH;
  const captionH = showCaption ? capPx + 4 : 0;
  let bestSize = 0, bestCols = 1, bestRows = n;
  for(let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const cellW = W / cols;
    const cellH = H / rows;
    const avail = Math.min(cellW + overlapX, cellH - captionH + overlapY);
    if(avail <= 0) continue;
    const size = (style === 'pixel')
      ? 96 * Math.max(1, Math.floor(avail / 96))
      : Math.floor(avail);
    if(size > bestSize){ bestSize = size; bestCols = cols; bestRows = rows; }
  }
  return { cols: bestCols, rows: bestRows };
}

function chunk(arr, size){
  const out = [];
  for(let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
  return out;
}
async function buildChainsFromList(list){
  const chainMap = new Map();
  for(const item of list){
    const sp = item.chain ? item : await speciesById(item.id);
    if(!sp.chain){
      chainMap.set('nochain:'+sp.id, { ids: [sp.id] });
      continue;
    }
    if(!chainMap.has(sp.chain)){
      const ids = await evoLine(sp.chain).catch(() => [sp.id]);
      chainMap.set(sp.chain, { ids: ids.sort((a,b) => a-b) });
    }
  }
  return [...chainMap.values()].sort((a,b) => (a.ids[0]||99999) - (b.ids[0]||99999));
}

// Mitchell's best-candidate blue noise shuffle for 2D grids
function blueNoiseShuffle(list, cols, rows) {
  const n = list.length;
  if(n < 2) return [...list];
  const actualRows = rows || Math.ceil(n / cols);
  const cw = 2480 / cols;            // cell width in actual page pixels
  const ch = 3508 / actualRows;      // cell height in actual page pixels
  const px = i => (i % cols) * cw;
  const py = i => Math.floor(i / cols) * ch;
  const d2 = (a, b) => { const dx = px(a)-px(b), dy = py(a)-py(b); return dx*dx+dy*dy; };

  const avail = [...Array(n).keys()];
  const order = [avail.splice(Math.floor(Math.random()*n), 1)[0]];
  while(avail.length) {
    const k = Math.min(avail.length, 30);
    let best = -1, bestD = -1;
    for(let t = 0; t < k; t++){
      const ri = Math.floor(Math.random() * avail.length);
      const cand = avail[ri];
      let minD = Infinity;
      for(const p of order) minD = Math.min(minD, d2(cand, p));
      if(minD > bestD){ bestD = minD; best = ri; }
    }
    order.push(avail.splice(best, 1)[0]);
  }
  // order[i] = grid position where list[i] goes
  const result = new Array(n);
  for(let i = 0; i < n; i++) result[order[i]] = list[i];
  return result;
}

// Blue-noise continuous scatter positions within page bounds
function scatterPositions(n, spriteSize, pad, titleH) {
  const minX = pad, maxX = 2480 - pad - spriteSize;
  const minY = pad, maxY = 3508 - pad - titleH - spriteSize;
  const randPos = () => [minX + Math.random() * (maxX - minX), minY + Math.random() * (maxY - minY)];
  const d2 = (a, b) => { const dx = a[0]-b[0], dy = a[1]-b[1]; return dx*dx+dy*dy; };
  const positions = [randPos()];
  while(positions.length < n){
    let best = null, bestD = -1;
    for(let t = 0; t < 40; t++){
      const cand = randPos();
      let minD = Infinity;
      for(const p of positions) minD = Math.min(minD, d2(cand, p));
      if(minD > bestD){ bestD = minD; best = cand; }
    }
    positions.push(best);
  }
  return positions;
}

async function renderPoster(list){
  let cols = +v('posterCols'), rows = +v('posterRows');
  const gapX = +v('posterGapX'), gapY = +v('posterGapY'), pad = +v('posterPad');
  const style = v('style');

  setVar('--pad-poster', pad+'px');
  if(gapY >= 0){ setVar('--poster-row-gap', gapY+'px'); setVar('--poster-neg-row','0px'); }
  else { setVar('--poster-row-gap','0px'); setVar('--poster-neg-row', Math.abs(gapY)+'px'); }
  if(gapX >= 0){ setVar('--poster-col-gap', gapX+'px'); setVar('--poster-neg-col','0px'); }
  else { setVar('--poster-col-gap','0px'); setVar('--poster-neg-col', Math.abs(gapX)+'px'); }

  setVar('--poster-name-fz', v('capPx')+'px');
  setVar('--poster-name-color', v('capColor'));
  setVar('--cap-offset-y', v('capOffsetY')+'px');
  setVar('--cap-offset-x', v('capOffsetX')+'px');
  setVar('--poster-title-font', `"${v('posterFont') || 'VT323'}"`);

  const showCaption = el('posterShowCaption').checked;
  const showTitle   = el('posterShowTitle').checked;
  const posterMode  = v('posterMode') || 'image';
  const blueNoise   = el('posterBlueNoise').checked;

  // Detect multi-region: custom IDs spanning >1 generation, or gen=all
  const gen = v('gen');
  const gens = new Set(list.map(x => x.generation).filter(Boolean));
  const multiRegion = gens.size > 1 || (gen === 'all' && !parseIds(el('specificIds').value).length);

  // Title height: 0 when hidden (saves space for grid)
  const capPx  = parseInt(v('capPx'));
  const titleH = (!multiRegion && showTitle) ? 100 : 0;
  const overlapX = gapX < 0 ? Math.abs(gapX) : 0;
  const overlapY = gapY < 0 ? Math.abs(gapY) : 0;

  if(el('posterBestFit').checked && list.length){
    const captionInFlow = el('posterShowCaption').checked && posterMode === 'grid';
    ({ cols, rows } = bestFitLayout(list.length, pad, titleH, capPx, style,
      captionInFlow, overlapX, overlapY));
  }
  setVar('--poster-cols', cols);
  setVar('--poster-rows', rows);

  const cellW  = (2480 - 2*pad) / cols;
  const cellH  = (3508 - 2*pad - titleH) / rows;
  const spriteSize = Math.max(10, Math.floor(posterImgSize(cellW + overlapX, cellH + overlapY, style)));
  setVar('--img', spriteSize + 'px');

  const root = el('root');
  root.innerHTML = '';

  // Title data — custom title overrides gen title when typed, even without custom IDs
  const customTitle = v('posterCustomTitle').trim().toUpperCase();
  const isCustomList = parseIds(el('specificIds').value).length > 0 || !!customTitle;
  const region   = GEN_REGIONS[gen] || 'REGION';
  const genLabel = (gen==='all') ? 'GEN 1–9' : ('GEN ' + gen);
  const regionDesc = GEN_DESC[gen] || '';

  // Apply blue noise shuffle before chunking
  const orderedList = blueNoise ? blueNoiseShuffle(list, cols, rows) : list;

  // Chunk list into pages
  const pageSize = cols * rows;
  const chunks = [];
  for(let i = 0; i < orderedList.length; i += pageSize) chunks.push(orderedList.slice(i, i + pageSize));
  if(!chunks.length) chunks.push([]);

  for(let pi = 0; pi < chunks.length; pi++){
    const page = document.createElement('div'); page.className = `page poster mode-${posterMode}`;
    const inner = document.createElement('div'); inner.className = 'inner';
    // Reserve extra bottom space for title so grid never overlaps it
    if(pi === 0 && showTitle) inner.style.paddingBottom = (pad + titleH) + 'px';

    if(posterMode === 'scatter'){
      // Scatter: blue-noise continuous positions, no grid
      inner.style.padding = '0';
      const scatterTitleH = (pi === 0 && showTitle) ? 100 : 0;
      const positions = scatterPositions(chunks[pi].length, spriteSize, pad, scatterTitleH);
      chunks[pi].forEach((pk, ci) => {
        const [sx, sy] = positions[ci];
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.style.cssText = `position:absolute;left:${Math.round(sx)}px;top:${Math.round(sy)}px;width:${spriteSize}px;height:${spriteSize}px;`;
        cell.appendChild(spriteWrap(artURL(pk.id, style), style));
        if(showCaption){
          const cap = document.createElement('div'); cap.className = 'caption';
          cap.innerHTML = `<span class="cap-nm">${pk.name}</span><span class="cap-dex">#${String(pk.id).padStart(3,'0')}</span>`;
          cell.appendChild(cap);
        }
        inner.appendChild(cell);
      });
    } else {
      // Grid mode (image or grid)
      const grid = document.createElement('div');
      grid.className = 'poster-grid';

      chunks[pi].forEach(pk => {
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.appendChild(spriteWrap(artURL(pk.id, style), style));
        if(showCaption){
          const cap = document.createElement('div'); cap.className = 'caption';
          cap.innerHTML = `<span class="cap-nm">${pk.name}</span><span class="cap-dex">#${String(pk.id).padStart(3,'0')}</span>`;
          cell.appendChild(cap);
        }
        grid.appendChild(cell);
      });

      // Center incomplete last row
      const lastRowCount = chunks[pi].length % cols;
      if(lastRowCount > 0){
        const startCol = Math.floor((cols - lastRowCount) / 2) + 1;
        grid.children[chunks[pi].length - lastRowCount].style.gridColumnStart = startCol;
      }

      inner.appendChild(grid);
    }

    page.appendChild(inner);

    // Title: absolute on page, always within page bounds regardless of grid overflow
    if(pi === 0 && showTitle){
      const title = document.createElement('div'); title.className = 'poster-title';
      if(isCustomList){
        title.innerHTML = `
          <div class="title-main">
            <span class="reg-label">${customTitle || 'MY COLLECTION'}</span>
          </div>`;
      } else {
        title.innerHTML = `
          <div class="title-main">
            <span class="gen-label">${genLabel}</span>
            <span class="title-sep">|</span>
            <span class="reg-label">${region}</span>
          </div>
          <div class="title-desc-wrap">${regionDesc}</div>`;
      }
      page.appendChild(title);
    }
    root.appendChild(page);
    await preloadImages(page);
  }
}

// Type symbol as an inline SVG filled with `fill` (circle background removed),
// or a lettered fallback tile when the icon can't be fetched.
async function typeIconNode(type, fill){
  const svgText = await fetchTypeIcon(type);
  if(svgText){
    try{
      const svgDoc = (new DOMParser()).parseFromString(svgText, 'image/svg+xml');
      const svgEl = svgDoc.documentElement;
      if(svgEl.tagName.toLowerCase() === 'svg' && !svgEl.querySelector('parsererror')){
        // Color elements inline (no <style> tag — prevents cross-card leaking)
        svgEl.querySelectorAll('circle').forEach(c => { c.style.display = 'none'; });
        svgEl.querySelectorAll('path,polygon,polyline,ellipse,rect').forEach(s => { s.style.fill = fill; });
        svgEl.removeAttribute('width'); svgEl.removeAttribute('height');
        svgEl.style.cssText = 'display:block;flex-shrink:0;';
        return document.importNode(svgEl, true);
      }
    }catch(_){}
  }
  const fb = document.createElement('div'); fb.className = 'type-icon-fallback';
  fb.textContent = type[0].toUpperCase(); fb.style.background = fill;
  return fb;
}

// Blend two #rrggbb colors; t = weight of b (0..1)
function hexMix(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2,'0')).join('');
}
function inkOn(hex){
  const [r,g,b] = [1,3,5].map(i => parseInt(hex.slice(i, i+2), 16) / 255);
  return (0.299*r + 0.587*g + 0.114*b) > 0.62 ? '#1b1b1b' : '#ffffff';
}

const GEN_ROMAN = {
  'generation-i':'I','generation-ii':'II','generation-iii':'III','generation-iv':'IV','generation-v':'V',
  'generation-vi':'VI','generation-vii':'VII','generation-viii':'VIII','generation-ix':'IX'
};
const STAT_LABELS = [
  ['hp','HP'], ['attack','ATK'], ['defense','DEF'],
  ['special-attack','SPA'], ['special-defense','SPD'], ['speed','SPE']
];

async function renderPremiumCard(pkId, sp, pd, style, lang, textMode){
  const types = pd.types?.length ? pd.types : ['normal'];
  const bg = /^#[0-9a-f]{6}$/i.test(v('cardBoxBg')) ? v('cardBoxBg') : '#ffffff';
  const t1 = typeColor(types[0]);
  const t2 = types[1] ? typeColor(types[1]) : hexMix(t1, '#000000', 0.22);
  const raw = sp._raw || {};
  const rare = !!(raw.is_legendary || raw.is_mythical);

  const card = document.createElement('div');
  card.className = 'card premium' + (rare ? ' rare' : '');
  card.dataset.text = textMode;
  const vars = {
    '--t1': t1, '--t2': t2,
    '--t1-light': hexMix(t1, '#ffffff', 0.45),
    '--t1-deep':  hexMix(t1, '#000000', 0.38),
    '--t1-glow':  hexMix(t1, '#ffffff', 0.86),
    '--t1-soft':  hexMix(t1, '#ffffff', 0.55),
    '--t2-soft':  hexMix(t2, '#ffffff', 0.35),
    '--t1-wash':  hexMix(t1, bg, 0.86),
    '--t1-line':  hexMix(t1, bg, 0.55),
  };
  for(const [k, val] of Object.entries(vars)) card.style.setProperty(k, val);

  const body = document.createElement('div'); body.className = 'pc-body';

  // Head: name + genus, dex number, type symbol
  const genus = (raw.genera || []).find(g => g.language?.name === 'en')?.genus || '';
  const head = document.createElement('div'); head.className = 'pc-head';
  head.innerHTML = `<div class="pc-titles"><div class="pc-name"></div><div class="pc-genus"></div></div><div class="pc-num">No.${String(pkId).padStart(3,'0')}</div>`;
  head.querySelector('.pc-name').textContent = localName(raw, lang);
  head.querySelector('.pc-genus').textContent = genus || ' ';
  const icon = document.createElement('div'); icon.className = 'pc-icon';
  icon.appendChild(await typeIconNode(types[0], '#ffffff'));
  head.appendChild(icon);

  // Art window: gradient backdrop, type watermark, sheen, floor shadow, type chips
  const art = document.createElement('div'); art.className = 'pc-art';
  const mark = document.createElement('div'); mark.className = 'pc-watermark';
  mark.appendChild(await typeIconNode(types[0], '#ffffff'));
  const floor = document.createElement('div'); floor.className = 'pc-floor';
  const sheen = document.createElement('div'); sheen.className = 'pc-sheen';
  const chips = document.createElement('div'); chips.className = 'pc-types';
  for(const t of types){
    const c = document.createElement('span'); c.className = 'pc-type';
    c.textContent = t;
    c.style.background = typeColor(t);
    c.style.color = inkOn(typeColor(t));
    chips.appendChild(c);
  }
  art.append(mark, floor, spriteWrap(artURL(pkId, style), style), sheen, chips);

  body.append(head, art);

  // Evolution chips
  const chainIds = await evoLine(sp.chain).catch(() => [pkId]);
  if(chainIds.length > 1){
    const evo = document.createElement('div'); evo.className = 'pc-evo';
    chainIds.forEach((id, i) => {
      const chip = document.createElement('div');
      chip.className = 'pc-evo-chip' + (id === pkId ? ' current' : '');
      const m = document.createElement('img');
      m.className = 'mini' + (style === 'pixel' ? ' pixel' : '');
      m.crossOrigin = 'anonymous';
      m.decoding = 'async';
      m.src = (style==='pixel')
        ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`
        : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`;
      chip.appendChild(m);
      evo.appendChild(chip);
      if(i < chainIds.length - 1){
        const a = document.createElement('div'); a.className = 'pc-evo-arrow';
        evo.appendChild(a);
      }
    });
    body.appendChild(evo);
  }

  // Facts: height, weight, region
  const region = API_GEN_TO_REGION[sp.generation] || '—';
  const facts = document.createElement('div'); facts.className = 'pc-facts';
  const fact = (k, val) => `<div class="pc-fact"><div class="pc-label">${k}</div><div class="pc-val">${val}</div></div>`;
  facts.innerHTML =
    fact('Height', pd.height != null ? (pd.height / 10).toFixed(1) + ' m' : '—') +
    fact('Weight', pd.weight != null ? (pd.weight / 10).toFixed(1) + ' kg' : '—') +
    fact('Region', region.charAt(0) + region.slice(1).toLowerCase());
  body.appendChild(facts);

  // Abilities
  const abil = document.createElement('div'); abil.className = 'pc-abil';
  abil.innerHTML = `<span class="pc-label">Abilities</span>` + ((pd.abilities || []).slice(0,3).map(a =>
    `<span class="pc-pill${a.hidden ? ' hidden' : ''}">${a.name}</span>`
  ).join('') || '<span class="pc-pill">—</span>');
  body.appendChild(abil);

  // Base stats
  if(el('pcStats').checked && pd.stats?.length){
    const stats = document.createElement('div'); stats.className = 'pc-stats';
    stats.innerHTML = STAT_LABELS.map(([key, label]) => {
      const n = pd.stats.find(s => s.name === key)?.base ?? 0;
      const pct = Math.min(100, Math.round(n / 180 * 100));
      return `<div class="pc-stat"><span class="k">${label}</span><span class="n">${n}</span><span class="pc-bar"><i style="width:${pct}%"></i></span></div>`;
    }).join('');
    body.appendChild(stats);
  }

  // Flavor text + footer
  const desc = document.createElement('div'); desc.className = 'pc-desc';
  desc.textContent = sp._raw ? flavorFromRaw(sp._raw, lang) : '';
  const foot = document.createElement('div'); foot.className = 'pc-foot';
  const total = (pd.stats || []).reduce((s, x) => s + x.base, 0);
  const rareTag = raw.is_mythical ? 'Mythical' : raw.is_legendary ? 'Legendary' : '';
  foot.innerHTML = `<span>Gen ${GEN_ROMAN[sp.generation] || '?'} · Pokédex</span>` +
    (rareTag ? `<span class="pc-rare">★ ${rareTag}</span>` : `<span>${total ? 'BST ' + total : ''}</span>`);
  body.append(desc, foot);

  card.appendChild(body);
  return card;
}

async function renderCard(pkId, style, lang, textMode, showRegion=true){
  const sp = await speciesById(pkId);
  const pd = await pokemonData(pkId).catch(() => ({types:[], abilities:[]}));
  if(v('cardDesign') === 'premium') return renderPremiumCard(pkId, sp, pd, style, lang, textMode);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.text = textMode;

  // Head
  const head = document.createElement('div'); head.className = 'head';
  head.innerHTML = `<div class="line"><div><div class="bold">${localName(sp._raw, lang).toUpperCase()}</div><div class="num">No.${String(pkId).padStart(3,'0')}</div></div><div class="right"></div></div>`;

  // Core
  const core = document.createElement('div'); core.className = 'core';
  core.appendChild(spriteWrap(artURL(pkId, style), style));

  // Evo strip
  const evo = document.createElement('div'); evo.className = 'evo-strip';
  const chainIds = await evoLine(sp.chain).catch(() => [pkId]);
  const ids = chainIds.length ? chainIds : [pkId];

  ids.forEach((id, i) => {
    const w = document.createElement('div');
    w.className = 'mini-wrap' + (id===pkId ? ' current' : '');
    const m = document.createElement('img');
    m.className = 'mini';
    m.crossOrigin = 'anonymous';
    m.decoding = 'async';
    m.src = (style==='pixel')
      ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`
      : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`;
    w.appendChild(m);
    evo.appendChild(w);
    if(i < ids.length-1){
      const a = document.createElement('div'); a.className = 'arrow';
      evo.appendChild(a);
    }
  });

  // Info
  const info = document.createElement('div'); info.className = 'info';
  const meta = document.createElement('div'); meta.className = 'meta';

  const region = API_GEN_TO_REGION[sp.generation] || 'REGION';
  const abTags = (pd.abilities||[]).slice(0,4).map(a =>
    `<span class="ab-tag${a.hidden ? ' ab-hidden' : ''}">${a.name}</span>`
  ).join('');
  meta.innerHTML = `<div><div class="ab-list">${abTags || '<span class="ab-tag">\u2014</span>'}</div></div><div><b>Region:</b> <span class="meta-val">${region}</span></div>`;

  const desc = document.createElement('div'); desc.className = 'desc';
  desc.textContent = sp._raw ? flavorFromRaw(sp._raw, lang) : '';

  info.append(meta, desc);

  // Type badge: inline SVG symbol (no circle) + name tag below
  const badge = document.createElement('div'); badge.className = 'type-badge';
  const mainType = pd.types?.[0] || 'normal';
  const iconColor = typeColor(mainType);
  const iconWrap = document.createElement('div'); iconWrap.className = 'type-icon-wrap';
  iconWrap.appendChild(await typeIconNode(mainType, iconColor));
  const nameTag = document.createElement('div'); nameTag.className = 'type-name-tag';
  nameTag.textContent = mainType.toUpperCase();
  nameTag.style.color = iconColor;
  iconWrap.appendChild(nameTag);
  badge.appendChild(iconWrap);

  card.append(head, core, ...(ids.length > 1 ? [evo] : []), info);
  head.querySelector('.right').appendChild(badge);
  return card;
}

async function renderCards(list){
  const cols = +v('cardCols'), rows = +v('cardRows'), gap = +v('cardGap'), pad = +v('cardsPad');
  const cardPad = +v('cardPad'), style = v('style'), lang = 'en';
  const paging = v('cardsPaging'), textMode = v('textMode');

  setVar('--pad-cards', pad+'px');
  setVar('--card-cols', cols);
  setVar('--card-rows', rows);
  if(gap >= 0){ setVar('--card-gap', gap+'px'); setVar('--card-gap-abs','0px'); }
  else { setVar('--card-gap','0px'); setVar('--card-gap-abs', Math.abs(gap)+'px'); }
  setVar('--card-pad', cardPad+'px');
  setVar('--sprite-shift-y', v('spriteY')+'px');

  const evoOn = el('evoBoxOn').checked;
  const evoScale = parseFloat(el('evoBoxScale').value) || 0.6;
  setVar('--evo-box-scale', evoScale);
  setVar('--evo-box-bg', evoOn ? el('evoBoxColor').value : 'transparent');
  setVar('--evo-box-border', evoOn ? el('evoBorderColor').value : 'transparent');
  setVar('--evo-fill', v('evoFill'));
  setVar('--evo-stroke', v('evoStroke'));
  setVar('--card-box-bg', v('cardBoxBg'));
  setVar('--card-box-ink', v('cardBoxInk'));

  setVar('--head-fz', v('cHead')+'px');
  setVar('--meta-fz', v('cMeta')+'px');
  setVar('--meta-label-fz', v('metaLabelSize')+'px');
  setVar('--meta-value-fz', v('metaValueSize')+'px');
  setVar('--desc-fz', v('cDesc')+'px');
  setVar('--meta-gap', v('metaGap')+'px');

  const dims = cardDims(cols, rows, pad, gap);
  setVar('--card-w', dims.w+'px');
  setVar('--card-h', dims.h+'px');

  const baseMini = +v('miniSize') || 56;
  setVar('--mini', Math.round(dims.w * (baseMini / 760)) + 'px');

  const imgSz = spriteSize(dims.w - cardPad*2, dims.h - cardPad*2, style);
  setVar('--img', imgSz+'px');
  // Pixel sprites carry transparent padding, so they can be drawn larger than the window
  const artBox = Math.floor(dims.h * 0.40 * (style === 'pixel' ? 1.15 : 0.86));
  setVar('--pc-img', (style === 'pixel' ? spriteSize(artBox, artBox, style) : artBox) + 'px');

  const gens = new Set(list.map(x => x.generation).filter(Boolean));

  const perPage = cols * rows;
  const root = el('root');
  root.innerHTML = '';

  async function renderPage(pageIds){
    const page = document.createElement('div'); page.className = 'page cards';
    const inner = document.createElement('div'); inner.className = 'inner';
    const grid = document.createElement('div');
    grid.className = 'grid' + (gap<0 ? ' neg-gap' : '');

    for(const id of pageIds){
      grid.appendChild(await renderCard(id, style, lang, textMode, true));
    }
    for(let k = 0; k < perPage - pageIds.length; k++){
      const ph = document.createElement('div'); ph.className = 'card placeholder';
      grid.appendChild(ph);
    }
    inner.appendChild(grid);
    page.appendChild(inner);
    root.appendChild(page);
    await preloadImages(page);
  }

  if(paging === 'evolution'){
    const chains = await buildChainsFromList(list);
    const start = Math.max(1, parseInt(v('chainStart'),10)||1) - 1;
    const count = Math.max(1, parseInt(v('chainCount'),10)||10);
    const allIds = chains.slice(start, start+count).flatMap(ch => ch.ids);
    for(const pageIds of chunk(allIds, perPage)){
      await renderPage(pageIds);
    }
  } else {
    const chunks = chunk(list.map(x=>x.id), perPage);
    for(const pageIds of (chunks.length ? chunks : [[]])){
      await renderPage(pageIds);
    }
  }
}

async function build(){
  showLoading();
  try{
    await readyFonts();
    setVar('--zoom', v('zoom'));

    const ids = parseIds(el('specificIds').value);
    const selectedTypes = [...document.querySelectorAll('#typeFilter .type-pill.active')].map(p => p.dataset.type);
    let list;
    if(ids.length){
      list = await resolveListFromIds(ids);
    } else {
      const gen = v('gen');
      let full = (gen==='all') ? await allSpecies() : await genSpecies(gen);

      // Type filter: fetch PokeAPI type data and intersect
      if(selectedTypes.length){
        const [minId, maxId] = GEN_ID_RANGES[gen] || [1, 1010];
        const typeData = await Promise.all(selectedTypes.map(t => cachedFetch(`https://pokeapi.co/api/v2/type/${t}/`)));
        const typeIds = new Set();
        for(const td of typeData){
          for(const p of td.pokemon){
            const pid = +p.pokemon.url.split('/').slice(-2,-1)[0];
            if(pid >= minId && pid <= maxId) typeIds.add(pid);
          }
        }
        full = full.filter(pk => typeIds.has(pk.id));
      }

      if(MODE.get() === 'cards'){
        const perPage = Math.max(1, +v('cardCols')) * Math.max(1, +v('cardRows'));
        list = full.slice(0, perPage);
      } else {
        list = full;
      }
    }

    // Sort by type if requested
    if(v('sortBy') === 'type' && list.length){
      const typeData = await Promise.all(list.map(pk => pokemonData(pk.id).catch(() => ({types:['normal']}))));
      const typeMap = new Map(list.map((pk, i) => [pk.id, typeData[i].types?.[0] || 'normal']));
      list = [...list].sort((a, b) => typeIdx(typeMap.get(a.id)) - typeIdx(typeMap.get(b.id)) || a.id - b.id);
    }

    if(MODE.get() === 'poster') await renderPoster(list);
    else await renderCards(list);
  } finally {
    hideLoading();
  }
}

el('randomIdsBtn').addEventListener('click', async () => {
  const selectedTypes = [...document.querySelectorAll('#typeFilter .type-pill.active')].map(p => p.dataset.type);
  let pool;
  if(selectedTypes.length){
    const gen = v('gen');
    const [minId, maxId] = GEN_ID_RANGES[gen] || [1, 1010];
    const typeData = await Promise.all(selectedTypes.map(t => cachedFetch(`https://pokeapi.co/api/v2/type/${t}/`)));
    const typeIds = new Set();
    for(const td of typeData){
      for(const p of td.pokemon){
        const pid = +p.pokemon.url.split('/').slice(-2,-1)[0];
        if(pid >= minId && pid <= maxId) typeIds.add(pid);
      }
    }
    pool = [...typeIds];
  } else {
    pool = Array.from({length: 1010}, (_, i) => i + 1);
  }
  // Shuffle pool and take 150
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const n = Math.max(1, parseInt(v('posterCols') || 9) * parseInt(v('posterRows') || 13));
  const picks = pool.slice(0, Math.min(n, pool.length));
  el('specificIds').value = picks.sort((a,b) => a-b).join(', ');
  debouncedBuild();
});
el('cleanBtn').addEventListener('click', () => {
  el('specificIds').value = '';
  debouncedBuild();
});

el('printBtn').addEventListener('click', async () => {
  await readyFonts();

});

el('downloadBtn').addEventListener('click', async () => {
  await readyFonts();
  const page = document.querySelector('.page');

  document.body.dataset.exporting = '1';
  await preloadImages(page);
  const canvas = await html2canvas(page, { scale:3, useCORS:true, backgroundColor:'#ffffff' });
  document.body.removeAttribute('data-exporting');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'page.png';
  a.click();
});
